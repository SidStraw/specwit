name: specwit
version: 1
description: "具有明確生命週期界線的證據導向交付流程"
artifacts:
  - id: proposal
    generates: proposal.md
    description: "來源、範圍、discovery 與完成位置"
    template: proposal.md
    instruction: |
      檢查真實專案與現有 specs，記錄來源位置與版本、範圍、非目標、觀察、假設、授權及 LOCAL／CI 完成位置。未知事項填 unknown。本 schema 用於行為變更；沒有行為需求的工作應另選較輕量的 schema。
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: "可觀察的 OpenSpec delta requirements"
    template: spec.md
    instruction: |
      每個 capability 建立 specs/<capability>/spec.md。新能力填至少 50 字元的 Purpose；保留 ADDED／MODIFIED／REMOVED／RENAMED Requirements、### Requirement: ID - 名稱、SHALL／MUST 與 #### Scenario: 的 WHEN／THEN 格式。需求 ID 在同一 change 內不可重複。MODIFIED 需複製完整既有需求；移除需附 Reason 與 Migration。selector 與實作細節放在 design。
    requires: ["proposal"]
  - id: behavior-plan
    generates: behavior-plan.md
    description: "覆蓋、反例、測試價值與未知"
    template: behavior-plan.md
    instruction: |
      每條來源需求都對應行為、人工判斷、待澄清或有理由的排除。分開驗證方式與準備狀態；各行為列出可觀察結果、失敗反例、重用檢查、增量證據與成本。缺少自動化不能改稱 HUMAN_ONLY。沒有適用來源時，確認保持 PENDING。
    requires: ["specs"]
  - id: design
    generates: design.md
    description: "實作、專案接法與信任邊界"
    template: design.md
    instruction: |
      先讀實作、測試與設定再提出 binding。使用適合專案類型的入口與可觀察結果、fixture、啟動／ready 條件與觀察窗。區分事實與提案，缺少接法填 MISSING。如實描述 runner／reviewer 權限。design 必填，但可保持簡短。
    requires: ["behavior-plan"]
  - id: verification-contract
    generates: verification-contract.json
    description: "可攜的結構化驗證輸入"
    template: verification-contract.json
    instruction: |
      產生符合 .governance/contracts/verification-contract.schema.json 的純 JSON。填真實來源雜湊、唯一的 requirement／check／criterion IDs、資源、預算、人工項目與清理歸屬。使用 schemaVersion 0.1 與 Observe。範本是未完成草稿，必要空陣列不是可執行契約。真實來源確認此計畫前保持 PENDING；使用 specwit validate <change> 取得實際 planDigest，不虛構核准或雜湊。
    requires: ["behavior-plan", "design"]
  - id: tasks
    generates: tasks.md
    description: "實作、證據、交付與明確完成"
    template: tasks.md
    instruction: |
      使用編號 checkbox，每項附完成證據。包含確認、binding、baseline、實作與有價值的測試、驗證、人工檢視、授權交付及明確完成。直接使用 specwit validate、verify、status 與 complete。缺少外部能力時保持未勾選並列 BLOCKED_EXTERNAL，不因檔案存在就當成驗證通過。
    requires: ["verification-contract"]
apply:
  requires: [proposal, specs, behavior-plan, design, verification-contract, tasks]
  tracks: tasks.md
  instruction: |
    先讀 .governance/workflow.md 與全部 context files，核對適用的確認、專案接法與既有授權。執行前使用 specwit validate <change>，以 specwit verify <change> 執行檢查，再用 specwit status <change> 核對目前證據。必要的獨立 review 需使用相符 Run 識別資料匯入。失敗、未知、過期證據或缺少外部完成能力都保持未解決。specwit complete 只預覽清理，archive 不等於 Task 明確完成。
